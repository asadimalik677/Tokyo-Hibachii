<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Tokyo Hibachi</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23050303'/%3E%3Ccircle cx='32' cy='32' r='24' fill='%23b11219'/%3E%3Ctext x='32' y='39' font-size='22' text-anchor='middle' font-family='Georgia' font-weight='700' fill='%23f6d27d'%3ETH%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="admin-page">
  <main class="admin-page-shell">
    <section class="admin-shell">
      <div class="modal-top">
        <div>
          <p class="eyebrow">Tokyo Hibachi Admin</p>
          <h1>Reservation Dashboard</h1>
        </div>
        <a class="btn btn-light" href="../">Back to Website</a>
      </div>
      <form class="login-panel" id="loginForm">
        <h3>Admin Login</h3>
        <p>Use the private credentials to manage local reservations.</p>
        <label>Username<input type="text" name="username" autocomplete="username" required></label>
        <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
        <button class="btn btn-primary" type="submit">Login</button>
        <p class="form-message" id="loginMessage" role="status" aria-live="polite"></p>
      </form>
      <div class="dashboard is-hidden" id="dashboard">
        <div class="dashboard-top">
          <div><h3>Admin Dashboard</h3><p>Update reservation status, review details, or delete a booking.</p></div>
          <button class="btn btn-light" id="logoutButton" type="button">Logout</button>
        </div>
        <div class="dashboard-cards">
          <div><span>Total bookings</span><strong id="totalBookings">0</strong></div>
          <div><span>Pending</span><strong id="pendingBookings">0</strong></div>
          <div><span>Confirmed</span><strong id="confirmedBookings">0</strong></div>
          <div><span>Completed</span><strong id="completedBookings">0</strong></div>
        </div>
        <div class="booking-list" id="bookingList"></div>
      </div>
    </section>
  </main>
  <script src="../script.js"></script>
</body>
</html>
